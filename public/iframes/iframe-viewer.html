<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Certificate Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  
    img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
    }
  </style>
  
  
</head>
<body>
  <img id="certificate" src="" alt="Certificate">
  
  <script>
    const params = new URLSearchParams(window.location.search);
    const imgSrc = params.get("img");
    if (imgSrc) {
      document.getElementById("certificate").src = imgSrc;
    }
  </script>
</body>
</html>
